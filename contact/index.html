<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact | Bima Yusuf Dharmahita</title>
    <meta name="description" content="Kontak Bima Yusuf Dharmahita." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Outfit:wght@400;600;700;800;900&display=swap" />
    <link rel="icon" href="../assets/profile.jpg" />
    <link rel="stylesheet" href="../assets/styles.css" />
    <script src="../assets/config.js"></script>
    <script src="../assets/seed-data.js"></script>
    <script src="../assets/app.js" defer></script>
  </head>
  <body data-page="contact" data-base="../">
    <header class="site-header">
      <a class="brand" href="/" data-route="home" aria-label="Bima Yusuf Dharmahita">
        <span>Bima Yusuf Dharmahita</span>
      </a>
      <button class="nav-toggle" aria-label="Menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="site-nav" aria-label="Navigasi utama">
        <a href="/about/" data-route="about">About</a>
        <a href="/experience/" data-route="experience">Experience</a>
        <a href="/projects/" data-route="projects">Projects</a>
        <a href="/certificates/" data-route="certificates">Certificates</a>
        <a href="/contact/" data-route="contact">Contact</a>
      </nav>
    </header>

    <main>
      <section class="page-hero compact">
        <div>
          <p class="eyebrow" data-profile="contact_page_label">Contact</p>
          <h1 data-profile="contact_page_title">Mari Terhubung</h1>
          <p class="page-lead" data-profile="contact_page_intro">
            Terbuka untuk diskusi peluang kerja, project, dan kolaborasi profesional.
          </p>
        </div>
      </section>

      <section class="section contact-section">
        <div>
          <p class="eyebrow" data-profile="contact_direct_label">Direct Contact</p>
          <h2 data-profile="contact_direct_title">Kontak profesional</h2>
          <div class="contact-strip">
            <a data-profile-link="email" href="mailto:bimayusufdh@gmail.com">bimayusufdh@gmail.com</a>
            <a data-profile-link="telegram" href="https://t.me/bimayusufdh" target="_blank" rel="noreferrer">
              Telegram
            </a>
            <a data-profile-link="linkedin" href="https://linkedin.com/in/bimayusufdh" target="_blank" rel="noreferrer">
              LinkedIn
            </a>
          </div>
        </div>
        <form id="contact-form" class="contact-form">
          <label>
            Nama
            <input name="name" autocomplete="name" required />
          </label>
          <label>
            Email
            <input name="email" type="email" autocomplete="email" required />
          </label>
          <label>
            Pesan
            <textarea name="message" rows="5" required></textarea>
          </label>
          <button class="button primary" type="submit">Kirim Pesan</button>
          <p id="contact-status" class="form-status" role="status"></p>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <span>&copy; <span id="year"></span> <span data-profile="footer_text">Bima Yusuf Dharmahita</span></span>
      <a href="https://bimayusufdh.bydh.my.id" data-profile-link="footer_link" data-profile="footer_link_text">bimayusufdh.bydh.my.id</a>
    </footer>
  </body>
</html>
